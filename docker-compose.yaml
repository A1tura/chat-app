version: '3.7'

services:
  user-service:
    container_name: user-service
    build:
      context: ./user
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - KAFKA_HOST=kafka:9092
      - JWT_SECRET=engroehigheonhoenohehnieroenhoernhoenghoeoh
    networks:
      - app-network

  chat-service:
    container_name: chat-service
    build:
      context: ./chat
    ports:
      - "1337:1337"
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - KAFKA_HOST=kafka:9092
      - JWT_SECRET=engroehigheonhoenohehnieroenhoernhoenghoeoh
    networks:
      - app-network

  db:
    container_name: db
    image: postgres:latest
    build:
      context: ./db
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "localhost", "--port", "5432"]
      retries: 5
      interval: 10s
      start_period: 30s
      timeout: 5s


  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:latest
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - 2181:2181
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      retries: 5
      interval: 10s
      start_period: 30s
      timeout: 5s

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:latest
    depends_on:
      zookeeper:
          condition: service_healthy
    ports:
      - 9093:9093
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - app-network

    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      retries: 5
      interval: 30s
      start_period: 30s
      timeout: 10s

networks:
  app-network:
      driver: bridge
