version: '3.7'

services:
  user-service:
    build:
      context: ./user
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:latest
    build:
      context: ./db
    ports:
      - "5432:5432"
    networks:
      - app-network

networks:
  app-network:
      driver: bridge
